# Despliegue de www-static/ a GitHub Pages
#
# 1. Clona el repo
# 2. Instala dependencias con Bun
# 3. Ejecuta el pipeline completo (codegen → CSS → build SPA → build estático)
# 4. Sube www-static/ como artifact de Pages
# 5. Despliega a GitHub Pages
#
# Requisito: en Settings → Pages → Source seleccionar "GitHub Actions".

name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos para deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Solo un despliegue concurrente
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        run: bun run static

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: www-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
